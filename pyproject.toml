[project]
name = "aws-stack-export"
version = "0.1.0"
description = "Exporter + splitter to snapshot AWS infra to CloudFormation and layer it for safe SCP rollout"
authors = [{ name = "Duke" }]
readme = "README_cfn_exporter.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34.0",
  "PyYAML>=6.0.1"
]

[project.scripts]
aws-cfn-export = "cfn_exporter:__main__"   # convenience: python -m cfn_exporter works; script path preferred
aws-cfn-split = "cfn_splitter:__main__"    # same note as above
iaacctl = "iaactools.codebase.cli_wrappers.iaacctl:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"