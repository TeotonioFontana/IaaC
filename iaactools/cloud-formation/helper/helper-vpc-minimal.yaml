AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal VPC + 1 public subnet + IGW + egress-only SG for a helper EC2

Parameters:
  EnvironmentName:
    Type: String
    Default: helper
    Description: Tag/name prefix (e.g., helper, staging, prod)
  VpcCidr:
    Type: String
    Default: 10.100.0.0/24
    Description: Small VPC CIDR
  PublicSubnetCidr:
    Type: String
    Default: 10.100.0.0/25
    Description: Public subnet CIDR inside the VPC

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  AttachIgw:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-a'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  DefaultRouteToIgw:
    Type: AWS::EC2::Route
    DependsOn: AttachIgw
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  AssocPublicSubnet:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  HelperEgressOnlySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only SG for helper (no inbound)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-helper-sg'

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
  PublicSubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet
  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable
  HelperSecurityGroupId:
    Description: Egress-only Security Group ID
    Value: !Ref HelperEgressOnlySg
