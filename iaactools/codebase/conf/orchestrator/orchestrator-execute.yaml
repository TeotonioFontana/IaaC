# =====================================================================
# orchestrator-execute.yaml — Backup Orchestrator (Execute Mode)
# =====================================================================
# Purpose: Full run with side effects enabled (snapshots and optional
#          full-volume backups). Uses SSO + AssumeRole as before.
# Notes:
# - Profile/regions/SSO/assume-role mirror the prior execute pack.
# - EBS backup defaults reflect your previous JSON settings.
# =====================================================================

# ---- Identity / Regions (from previous execute settings) ----
profile: architect                       # AWS CLI profile :contentReference[oaicite:4]{index=4}:contentReference[oaicite:5]{index=5}
region: us-east-2                         # Working region (aka source) :contentReference[oaicite:6]{index=6}:contentReference[oaicite:7]{index=7}
home_region: us-east-2                    # Home = source for your setup :contentReference[oaicite:8]{index=8}:contentReference[oaicite:9]{index=9}

# ---- Paths (normalized to your current layout) ----
tools_dir: /Users/teotonio/Projetos/IaaC/iaactools/codebase   # tool root :contentReference[oaicite:10]{index=10}:contentReference[oaicite:11]{index=11}
out_root:  /Users/teotonio/Projetos/IaaC/results
log_dir:   /Users/teotonio/Projetos/IaaC/results/logs

# ---- SSO / Identity Center and AssumeRole (as before) ----
instance_arn: arn:aws:sso:::instance/ssoins-6684b776b34e737d  # :contentReference[oaicite:12]{index=12}:contentReference[oaicite:13]{index=13}
identity_store_id: d-9a671b8524                                # :contentReference[oaicite:14]{index=14}:contentReference[oaicite:15]{index=15}
assume_role: arn:aws:iam::212533511020:role/SSOExportReadOnly  # :contentReference[oaicite:16]{index=16}:contentReference[oaicite:17]{index=17}
assume_sts_region: us-east-1                                   # :contentReference[oaicite:18]{index=18}:contentReference[oaicite:19]{index=19}

# ---- Execution switches ----
preview:  false      # validate only? no — we will execute :contentReference[oaicite:20]{index=20}
simulate: false      # dry-run? no — real calls :contentReference[oaicite:21]{index=21}:contentReference[oaicite:22]{index=22}
keep_going: false    # stop on first hard failure
dry_run:  false      # echo-only mode off

# ---- Backup mode ----
backup_type: snapshot    # snapshot | full-volume | both
enable_ebs:  true        # enable EBS phase (explicit) :contentReference[oaicite:23]{index=23}
enable_ami:  true        # keep parity with prior packs (no-op if unused) :contentReference[oaicite:24]{index=24}

# ---- EBS backup settings (ported from backup-full-volumes.json) ----
ebs_backup:                                                  # :contentReference[oaicite:25]{index=25}
  region: us-east-2
  tags_filter:
    Backup: "true"
  exclude_instance_ids: []
  snapshot_options:
    description_prefix: "FullBackup"
    retain_days: 14
  notification:
    sns_topic_arn: ""

# ---- Full-volume (optional) ----
full_volume:
  enabled: false                 # set true when you want block-level copies
  helper_instance_id: null       # or i-xxxxxxxx if you have a fixed helper
  preclear_helper: true
  throttle_mbps: 0               # 0 = unlimited (respect AWS limits)

# ---- S3 publishing ----
s3_upload: true
s3_bucket: my-company-backups
s3_prefix: orchestrator/         # base prefix for all artifacts
manifest_prefix: manifests/      # where run manifests go
log_prefix: logs/                # where orchestrator logs go

# ---- Logging / misc ----
log_level: INFO
timestamp_format: "%Y-%m-%dT%H:%M:%SZ"
