region: us-east-2
account_id: "212533511020"
instance_id: i-09b159cf466411e48
instance_role: TF_Debian_Instances
availability_zone: us-east-2c

storage:
  encryption_by_default: true
  filesystems:
    - path: /
      slug: root
    - path: /opt/apps
      slug: opt-apps
    - path: /var/lib/apps
      slug: var-lib-apps
    - path: /var/log/apps
      slug: var-log-apps
    - path: /var/cache/apps
      slug: var-cache-apps
    - path: /Osteolab
      slug: osteolab
  bind_mounts:
    - source: /opt/apps/spservicesapi/releases
      target: /var/www/python/spservicesapi/releases
    - source: /var/lib/apps/spservicesapi
      target: /var/lib/spservicesapi
    - source: /var/lib/apps/spservicesapi-canary
      target: /var/lib/spservicesapi-canary
    - source: /var/lib/apps/spservicesapi-fontana
      target: /var/lib/spservicesapi-fontana
    - source: /var/log/apps/spservicesapi-v4-legacy
      target: /var/www/python/spservicesapi/SPServicesAPI_V4/server_config/log

monitoring:
  namespace: SPServices/Host
  topic_arn: arn:aws:sns:us-east-2:212533511020:spservices-host-alerts
  notification_email: teotonio@tfontana.com.br
  thresholds:
    - name: warning
      percent: 70
      period: 300
      evaluation_periods: 3
      datapoints_to_alarm: 3
    - name: critical
      percent: 80
      period: 300
      evaluation_periods: 2
      datapoints_to_alarm: 2
    - name: emergency
      percent: 90
      period: 60
      evaluation_periods: 1
      datapoints_to_alarm: 1

temporary_snapshots:
  delete_after: "2026-11-07"
  retention_class: temporary-migration
